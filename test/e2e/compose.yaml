name: mirai-e2e

x-client: &client
  image: metacubex/mihomo:v1.19.31
  command: ["-d", "/tmp/mihomo", "-f", "/work/clients/client.yaml"]
  volumes: ["work:/work:ro"]
  depends_on: [node, target]

services:
  node:
    build: {context: ../.., dockerfile: test/e2e/Dockerfile}
    command: ["mirai-node"]
    environment:
      MIRAI_DATA_DIR: /data
      MIRAI_NODE_SOCKET: /run/mirai/node.sock
      MIRAI_DEVICE_RELEASE: 3s
      # the test target lives on a private docker network
      MIRAI_ALLOW_PRIVATE: "true"
    volumes: ["run:/run/mirai", "nodedata:/data"]

  target:
    build: {context: ../.., dockerfile: test/e2e/Dockerfile}
    command: ["target"]

  client-a: *client
  client-b: *client

  driver:
    image: golang:1.27
    working_dir: /src
    command: ["sleep", "infinity"]
    volumes:
      - "../..:/src:ro"
      - "work:/work"
      - "run:/run/mirai"
      - "mirai-gomod:/go/pkg/mod"
      - "mirai-gocache:/root/.cache/go-build"

volumes:
  run: {}
  nodedata: {}
  work: {}
  mirai-gomod: {external: true}
  mirai-gocache: {external: true}
