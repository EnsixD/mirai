mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
geodata-mode: false
geox-url:
  asn: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb
dns:
  enable: true
  ipv6: false
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    +.cn:
      - 223.5.5.5
proxy-groups:
  - name: VPN
    type: select
    proxies:
      - Auto
      - "\U0001F1F3\U0001F1F1 Нидерланды"
      - "\U0001F1FA\U0001F1F8 США"
    include-all-proxies: true
  - name: Auto
    type: fallback
    include-all-proxies: true
    interval: 120
    url: https://www.gstatic.com/generate_204
  - name: "\U0001F1F3\U0001F1F1 Нидерланды"
    type: url-test
    interval: 120
    mirai:
      nodes:
        - "\U0001F1F3\U0001F1F1 Нидерланды"
    tolerance: 50
    url: https://www.gstatic.com/generate_204
  - name: "\U0001F1FA\U0001F1F8 США"
    type: url-test
    interval: 120
    mirai:
      nodes:
        - "\U0001F1FA\U0001F1F8 США"
    tolerance: 50
    url: https://www.gstatic.com/generate_204
  - name: "\U0001F916 ChatGPT · Claude · Gemini"
    type: select
    proxies:
      - VPN
    mirai:
      nodes:
        - "\U0001F1FA\U0001F1F8 США"
  - name: PROXY
    type: select
    proxies:
      - VPN
    hidden: true
rules:
  - GEOIP,LAN,DIRECT,no-resolve
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  - DOMAIN-SUFFIX,sber.ru,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,youtube,VPN
  - GEOSITE,telegram,VPN
  - GEOIP,telegram,VPN,no-resolve
  - RULE-SET,mirai-telegram-ip,VPN,no-resolve
  - "GEOSITE,category-ai-!cn,\U0001F916 ChatGPT · Claude · Gemini"
  - "RULE-SET,mirai-ai,\U0001F916 ChatGPT · Claude · Gemini"
  - "RULE-SET,mirai-gemini,\U0001F916 ChatGPT · Claude · Gemini"
  - RULE-SET,mirai-torrent-apps,DIRECT
  - GEOSITE,category-public-tracker,DIRECT
  - RULE-SET,own-wl,VPN
  - RULE-SET,own-ru-ip,DIRECT,no-resolve
  - RULE-SET,mirai-ru-apps,DIRECT
  - RULE-SET,mirai-ru-pc,DIRECT
  - RULE-SET,mirai-ru-sites,DIRECT
  - RULE-SET,mirai-ru-keywords,DIRECT
  - RULE-SET,mirai-ru-core,DIRECT
  - MATCH,VPN
  - MATCH,REJECT
rule-providers:
  mirai-ai:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./ruleset/mirai-ai.yaml
    proxy: VPN
    url: https://raw.githubusercontent.com/Nemu-x/privWL-clash/5d0a5924b6c87e4abed0d3c87989ce2469679828/routing/ai.yaml
  mirai-gemini:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./ruleset/mirai-gemini.yaml
    proxy: VPN
    url: https://raw.githubusercontent.com/Nemu-x/privWL-clash/5d0a5924b6c87e4abed0d3c87989ce2469679828/routing/gemini.yaml
  mirai-ru-apps:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./ruleset/mirai-ru-apps.yaml
    proxy: VPN
    url: https://raw.githubusercontent.com/Nemu-x/privWL-clash/5d0a5924b6c87e4abed0d3c87989ce2469679828/ru/process-direct-apk.yaml
  mirai-ru-core:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./ruleset/mirai-ru-core.yaml
    proxy: VPN
    url: https://raw.githubusercontent.com/Nemu-x/privWL-clash/5d0a5924b6c87e4abed0d3c87989ce2469679828/ru/ru-core.yaml
  mirai-ru-keywords:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./ruleset/mirai-ru-keywords.yaml
    proxy: VPN
    url: https://raw.githubusercontent.com/Nemu-x/privWL-clash/5d0a5924b6c87e4abed0d3c87989ce2469679828/ru/domain-direct-keyword.yaml
  mirai-ru-pc:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./ruleset/mirai-ru-pc.yaml
    proxy: VPN
    url: https://raw.githubusercontent.com/Nemu-x/privWL-clash/5d0a5924b6c87e4abed0d3c87989ce2469679828/ru/process-direct-pc.yaml
  mirai-ru-sites:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./ruleset/mirai-ru-sites.yaml
    proxy: VPN
    url: https://raw.githubusercontent.com/Nemu-x/privWL-clash/5d0a5924b6c87e4abed0d3c87989ce2469679828/ru/domain-direct-suffix.yaml
  mirai-telegram-ip:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./ruleset/mirai-telegram-ip.yaml
    proxy: VPN
    url: https://raw.githubusercontent.com/Nemu-x/privWL-clash/5d0a5924b6c87e4abed0d3c87989ce2469679828/tgprx.yaml
  mirai-torrent-apps:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./ruleset/mirai-torrent-apps.yaml
    proxy: VPN
    url: https://raw.githubusercontent.com/legiz-ru/mihomo-rule-sets/a80b3c1d7a70ce83b1d1a45ff113a2fe5b312154/other/torrent-clients.yaml
  own-ru-ip:
    type: http
    behavior: ipcidr
    format: text
    interval: 86400
    path: ./ruleset/own-ru-ip.text
    proxy: VPN
    url: https://example.com/ru.txt
  own-wl:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./ruleset/own-wl.yaml
    proxy: VPN
    url: https://example.com/wl.yaml
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    QUIC:
      ports:
        - 443
        - 8443
    TLS:
      ports:
        - 443
        - 8443
